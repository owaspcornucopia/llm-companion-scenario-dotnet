services:
  downloader:
    image: python:3.11-slim
    volumes:
      - ./models/base/Phi-3-mini-4k-instruct-onnx:/models/Phi-3-mini-4k-instruct-onnx
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    # Skip repeat downloads, because bandwidth is expensive even when ego is not.
    command: >
      sh -c "pip install -q huggingface_hub &&
      (test -f /models/Phi-3-mini-4k-instruct-onnx/config.json || hf download microsoft/Phi-3-mini-4k-instruct-onnx --local-dir /models/Phi-3-mini-4k-instruct-onnx)"
  # Model service: loads the prepared ONNX model and serves inference on port 9001.
  model:
    build:
      context: .
      dockerfile: src/Companion.Api/Dockerfile
    ports:
      - "9001:9001"
    volumes:
      - ./models/base/Phi-3-mini-4k-instruct-onnx/cpu_and_mobile/cpu-int4-rtn-block-32:/models/phi3-base
    cpus: "8"
    mem_limit: 12g
    # Uncomment for GPU access when the CPU-only victory lap stops being fun.
    # Setup guide: https://docs.nvidia.com/cuda/wsl-user-guide/
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: 1
    #          capabilities: [gpu]
    environment:
      - SERVICE_MODE=model
      - ASPNETCORE_URLS=http://+:9001
      - MODEL__ONNXPATH=/models/phi3-base
    depends_on:
      downloader:
        condition: service_completed_successfully

  # App service: accepts the fraud question, hits the model service, and pokes the shared SQLite file.
  app:
    build:
      context: .
      dockerfile: src/Companion.Api/Dockerfile
    expose:
      - "9000"
    volumes:
      - app-db:/data
    environment:
      - SERVICE_MODE=app
      - ASPNETCORE_URLS=http://+:9000
      - MODEL_SERVICE_URL=http://model:9001
      - DB_CONNECTION_STRING=/data/db.sqlite
    depends_on:
      - model

  # Nginx front door: accepts traffic and fans it out to the app replicas.
  nginx:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  # Named volume so every app replica can point at the same SQLite file.
  app-db:
